<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Youth Football Play Counter</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --warning-bg: #fef9c3;
      --warning-border: #fde047;
      --success-bg: #dcfce7;
      --success-text: #166534;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; max-width: 1200px; margin: 0 auto; padding-bottom: 80px; }
    .header { background: var(--card); padding: 16px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 12px; text-align: center; }
    .header h1 { font-size: 1.35rem; margin-bottom: 8px; }
    .stats-bar { display: flex; justify-content: space-around; gap: 12px; margin-top: 10px; }
    .stat-card { background: #f1f5f9; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; text-align: center; flex: 1; }
    .stat-card strong { display: block; font-size: 1.3rem; color: var(--primary); }
    .controls { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .btn { background: var(--primary); color: white; border: none; padding: 12px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; flex: 1; text-align: center; font-size: 0.95rem; }
    .btn-secondary { background: #e2e8f0; color: var(--text); }
    .btn-danger { background: #ef4444; color: white; }
    .search-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 16px; font-size: 1rem; }
    
    /* Responsive Grid Layout for Player Cards */
    .player-list { 
      display: grid; 
      grid-template-columns: 1fr; /* Single column for phones */
      gap: 12px; 
    }

    /* 2 columns on medium screens (tablets / iPad portrait) */
    @media (min-width: 640px) {
      .player-list {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* 3 columns on large screens (iPad landscape / desktop) */
    @media (min-width: 960px) {
      .player-list {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .player-card { background: var(--card); border: 1px solid var(--border); padding: 12px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; }
    .player-card.needs-plays { background: var(--warning-bg); border-color: var(--warning-border); }
    .player-card.on-field { border-left: 6px solid var(--primary); }
    .player-info { display: flex; align-items: center; gap: 10px; overflow: hidden; }
    .jersey-tag { background: #0f172a; color: white; font-weight: bold; padding: 4px 8px; border-radius: 6px; min-width: 38px; text-align: center; flex-shrink: 0; }
    .player-name { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .counter-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .btn-qty { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: white; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
    .checkbox-field { width: 22px; height: 22px; cursor: pointer; flex-shrink: 0; }
  </style>
</head>
<body>

  <div class="header">
    <h1>10U Warrior | Play Counter</h1>
    <div class="stats-bar">
      <div class="stat-card">Total Plays<strong id="total-plays">0</strong></div>
      <div class="stat-card">On Field<strong id="on-field-count">0 / 11</strong></div>
      <div class="stat-card">Needs Plays<strong id="needs-plays-count">31</strong></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" onclick="logPlay()">Log Play (+1 On Field)</button>
    <button class="btn btn-secondary" onclick="clearField()">Clear Field</button>
  </div>

  <input type="text" id="search" class="search-input" placeholder="Search by name or jersey #..." oninput="render()">

  <div class="player-list" id="player-list"></div>

  <div class="controls" style="margin-top: 20px;">
    <button class="btn btn-secondary" onclick="exportPDF()">Export PDF Summary</button>
    <button class="btn btn-danger" onclick="resetGame()">Reset Game</button>
  </div>

  <script>
    const initialPlayers = [
      { jersey: 9, name: "Matthew Beasley" },
      { jersey: 14, name: "Easton Sherlock" },
      { jersey: 15, name: "Tanner James Sims" },
      { jersey: 16, name: "Cody Scott Roland" },
      { jersey: 21, name: "Kal-El Thornton" },
      { jersey: 23, name: "Josiah Eason" },
      { jersey: 26, name: "Lee Hardy" },
      { jersey: 44, name: "Sam Ledford" },
      { jersey: 58, name: "Jovanni Kelley" },
      { jersey: 89, name: "Bennett Pressley" },
      
    ];

    let players = JSON.parse(localStorage.getItem('fb_players')) || initialPlayers.map(p => ({ ...p, plays: 0, onField: false }));
    let totalGamePlays = parseInt(localStorage.getItem('fb_total_plays')) || 0;

    function save() {
      localStorage.setItem('fb_players', JSON.stringify(players));
      localStorage.setItem('fb_total_plays', totalGamePlays);
    }

    function toggleField(jersey) {
      const p = players.find(x => x.jersey === jersey);
      const activeCount = players.filter(x => x.onField).length;
      if (!p.onField && activeCount >= 11) {
        alert("Field full! You already have 11 players selected.");
        return;
      }
      p.onField = !p.onField;
      save();
      render();
    }

    function changePlays(jersey, delta) {
      const p = players.find(x => x.jersey === jersey);
      p.plays = Math.max(0, p.plays + delta);
      save();
      render();
    }

    function logPlay() {
      const active = players.filter(p => p.onField);
      if (active.length === 0) {
        alert("Select at least 1 player on the field before logging a play.");
        return;
      }
      active.forEach(p => p.plays++);
      totalGamePlays++;
      save();
      render();
    }

    function clearField() {
      players.forEach(p => p.onField = false);
      save();
      render();
    }

    function resetGame() {
      if (confirm("Reset all play counts and total plays for a new game?")) {
        players.forEach(p => { p.plays = 0; p.onField = false; });
        totalGamePlays = 0;
        save();
        render();
      }
    }

    function exportPDF() {
      const dateStr = new Date().toLocaleDateString();
      const needsPlaysCount = players.filter(p => p.plays < 6).length;
      const metRequirementCount = players.filter(p => p.plays >= 6).length;

      let rows = '';
      players.forEach(p => {
        const met = p.plays >= 6;
        const statusText = met ? 'Requirement Met' : 'Needs Plays (<6)';
        const statusBg = met ? '#dcfce7' : '#fef9c3';
        const statusColor = met ? '#166534' : '#854d0e';

        rows += `
          <tr style="border-bottom: 1px solid #e2e8f0;">
            <td style="padding: 8px 12px; font-weight: bold; text-align: center;">#${p.jersey}</td>
            <td style="padding: 8px 12px;">${p.name}</td>
            <td style="padding: 8px 12px; text-align: center; font-weight: bold;">${p.plays}</td>
            <td style="padding: 8px 12px; text-align: center;">
              <span style="background-color: ${statusBg}; color: ${statusColor}; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold;">
                ${statusText}
              </span>
            </td>
          </tr>
        `;
      });

      const printWindow = window.open('', '_blank');
      printWindow.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>10U Walnut Grove Warriors - Play Count Report</title>
          <style>
            body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; color: #0f172a; }
            h1 { text-align: center; font-size: 20px; margin-bottom: 4px; }
            .subtitle { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 20px; }
            .summary-box { display: flex; justify-content: space-around; background: #f1f5f9; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
            .summary-box div { font-size: 13px; color: #475569; }
            .summary-box strong { display: block; font-size: 18px; color: #2563eb; margin-top: 4px; }
            table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
            th { background-color: #0f172a; color: white; padding: 10px; text-align: left; }
            th.center { text-align: center; }
            @media print {
              body { padding: 0; }
            }
          </style>
        </head>
        <body>
          <h1>Walnut Grove Warriors — Official Game Play Report</h1>
          <div class="subtitle">Generated on ${dateStr}</div>

          <div class="summary-box">
            <div>Total Game Snap Count<strong>${totalGamePlays}</strong></div>
            <div>Met Requirement (6+)<strong>${metRequirementCount}</strong></div>
            <div>Needs Plays (<6)<strong>${needsPlaysCount}</strong></div>
          </div>

          <table>
            <thead>
              <tr>
                <th class="center" style="width: 15%;">Jersey #</th>
                <th style="width: 45%;">Player Name</th>
                <th class="center" style="width: 15%;">Plays</th>
                <th class="center" style="width: 25%;">Status</th>
              </tr>
            </thead>
            <tbody>
              ${rows}
            </tbody>
          </table>

          <script>
            window.onload = function() {
              window.print();
            };
          <\\/script>
        </body>
        </html>
      `);
      printWindow.document.close();
    }

    function render() {
      const search = document.getElementById('search').value.toLowerCase();
      const listEl = document.getElementById('player-list');
      listEl.innerHTML = '';

      const activeCount = players.filter(p => p.onField).length;
      const needsPlays = players.filter(p => p.plays < 6).length;

      document.getElementById('total-plays').innerText = totalGamePlays;
      document.getElementById('on-field-count').innerText = `${activeCount} / 11`;
      document.getElementById('needs-plays-count').innerText = needsPlays;

      players
        .filter(p => p.name.toLowerCase().includes(search) || p.jersey.toString().includes(search))
        .forEach(p => {
          const card = document.createElement('div');
          const isNeedsPlays = p.plays < 6;
          card.className = `player-card ${isNeedsPlays ? 'needs-plays' : ''} ${p.onField ? 'on-field' : ''}`;

          card.innerHTML = `
            <div class="player-info">
              <input type="checkbox" class="checkbox-field" ${p.onField ? 'checked' : ''} onchange="toggleField(${p.jersey})">
              <span class="jersey-tag">#${p.jersey}</span>
              <span class="player-name">${p.name}</span>
            </div>
            <div class="counter-controls">
              <button class="btn-qty" onclick="changePlays(${p.jersey}, -1)">-</button>
              <span style="font-weight:bold; min-width:20px; text-align:center;">${p.plays}</span>
              <button class="btn-qty" onclick="changePlays(${p.jersey}, 1)">+</button>
            </div>
          `;
          listEl.appendChild(card);
        });
    }

    render();
  </script>
</body>
</html>
